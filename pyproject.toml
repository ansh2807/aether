[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name differs from the import package: `aether` is already
# taken on PyPI. `import aether` and the `aether` command are unchanged.
name = "aether-orchestrator"
version = "0.1.0"
description = "A deterministic orchestrator for multi-agent AI work: the task survives when the model does not"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ansh2807" }]
keywords = [
  "ai", "agents", "multi-agent", "orchestration", "llm", "failover",
  "durability", "claude", "openai", "agent-framework",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "prompt-toolkit>=3.0.47",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "python-multipart>=0.0.9",
  "websockets>=13.0",
  "anyio>=4.4.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "httpx>=0.27.0",
]
# Opt-in: SQLite (via aiosqlite, a hard dependency above) stays the
# zero-setup default. Install this extra only when pointing
# `database_url` / `AETHER_DATABASE_URL` at a real Postgres instance.
postgres = [
  "asyncpg>=0.29.0",
]

[project.scripts]
aether = "aether.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/aether", "config", "docs", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.urls]
Homepage = "https://github.com/ansh2807/aether"
Repository = "https://github.com/ansh2807/aether"
Changelog = "https://github.com/ansh2807/aether/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ansh2807/aether/blob/main/docs/DURABILITY.md"
Issues = "https://github.com/ansh2807/aether/issues"
