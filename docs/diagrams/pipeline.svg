<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The path of one task through AETHER: prompt, plan, staffing, execution across models, then three gates — modality, security review and verification — any of which sends the work back rather than letting it pass.">
  <title>Anatomy of a run — three gates stand between an agent's claim and COMPLETED</title>
  <desc>A prompt is planned into subtasks, staffed to named specialists, and executed across a pool of models. Three gates follow: a modality gate that refuses media work no provider can do, a secure code review that fails the task on a high-severity finding, and verification that checks artifacts rather than claims. Any gate can return the work to the orchestrator. Only passing all three reaches COMPLETED.</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="arrowback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="16" fill="url(#pbg)"/>

  <text x="60" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#e6edf3">Anatomy of a run</text>
  <text x="60" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#7d8590">three gates stand between an agent saying “done” and the task being done</text>

  <!-- ─────────── stage 1: plan ─────────── -->
  <g>
    <rect x="60" y="130" width="150" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="135" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3">plan</text>
    <text x="135" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">prompt → subtasks</text>
  </g>
  <line x1="210" y1="166" x2="248" y2="166" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────── stage 2: staff ─────────── -->
  <g>
    <rect x="255" y="130" width="150" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="330" y="160" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3">staff</text>
    <text x="330" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">271 specialists</text>
  </g>
  <line x1="405" y1="166" x2="443" y2="166" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────── stage 3: execute across the pool ─────────── -->
  <g>
    <rect x="450" y="118" width="180" height="96" rx="10" fill="#161b22" stroke="#238636"/>
    <text x="540" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3">execute</text>
    <text x="540" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">30+ providers</text>
    <text x="540" y="187" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">free ones included</text>
    <text x="540" y="205" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#3fb950">checkpoint after each</text>
    <!-- a quiet pulse: work is moving through here -->
    <circle cx="470" cy="132" r="3" fill="#58a6ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="630" y1="166" x2="668" y2="166" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ─────────── the three gates ─────────── -->
  <text x="675" y="108" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">every one of these can send the work back</text>

  <!-- gate 1 -->
  <g>
    <rect x="675" y="120" width="152" height="92" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="751" y="146" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#e6edf3">modality gate</text>
    <text x="751" y="168" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">refuses media work</text>
    <text x="751" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">no provider can do</text>
    <text x="751" y="202" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#d29922">says so, never fakes</text>
  </g>

  <!-- gate 2 -->
  <g>
    <rect x="675" y="228" width="152" height="92" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="751" y="254" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#e6edf3">secure review</text>
    <text x="751" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">15 CWE detectors on</text>
    <text x="751" y="292" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">the code just written</text>
    <text x="751" y="310" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#d29922">HIGH fails the task</text>
  </g>

  <!-- gate 3 -->
  <g>
    <rect x="675" y="336" width="152" height="92" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="751" y="362" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#e6edf3">verification</text>
    <text x="751" y="384" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">reads artifacts, runs</text>
    <text x="751" y="400" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">tests in a container</text>
    <text x="751" y="418" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#d29922">claims are not evidence</text>
  </g>

  <!-- gate fan-out -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M668 166 L668 274 L675 274" marker-end="url(#arrow)"/>
    <path d="M668 274 L668 382 L675 382" marker-end="url(#arrow)"/>
  </g>

  <!-- ─────────── pass ─────────── -->
  <line x1="827" y1="166" x2="885" y2="166" stroke="#238636" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="856" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#3fb950">pass</text>

  <g>
    <rect x="890" y="128" width="150" height="76" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="965" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#3fb950">COMPLETED</text>
    <text x="965" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7d8590">artifacts on disk</text>
  </g>

  <!-- ─────────── the return path ─────────── -->
  <path d="M675 404 L560 404 L560 240 L540 240 L540 216"
        stroke="#f85149" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowback)">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text x="566" y="326" font-family="ui-monospace,monospace" font-size="10" fill="#f85149">fail → back to the</text>
  <text x="566" y="340" font-family="ui-monospace,monospace" font-size="10" fill="#f85149">orchestrator, never</text>
  <text x="566" y="354" font-family="ui-monospace,monospace" font-size="10" fill="#f85149">quietly onward</text>

  <!-- ─────────── the invariant ─────────── -->
  <text x="60" y="252" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">a model dying here</text>
  <text x="60" y="268" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">costs one subtask,</text>
  <text x="60" y="284" font-family="ui-monospace,monospace" font-size="11" fill="#7d8590">not the run</text>
  <path d="M150 262 L262 262 L262 214" stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>

  <g font-family="ui-monospace,monospace" font-size="11">
    <text x="60" y="360" fill="#7d8590">Everything above is deterministic:</text>
    <text x="60" y="380" fill="#7d8590">planning, staffing and routing run</text>
    <text x="60" y="400" fill="#7d8590">without asking a model to decide.</text>
    <text x="60" y="424" fill="#3fb950">440 tests · every durability claim cites one</text>
  </g>
</svg>
