name: aether

services:
  aether:
    build:
      context: .
    image: aether:local
    ports:
      # Local-only by default. Put an authenticated TLS reverse proxy in front
      # before deliberately exposing AETHER beyond this machine.
      - "127.0.0.1:7420:7420"
    volumes:
      - aether-data:/data
      - aether-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s

volumes:
  aether-data:
  aether-workspace:
