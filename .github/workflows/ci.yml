name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  postgres:
    name: tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Test (SQLite suite + Postgres suite)
        env:
          AETHER_TEST_POSTGRES_URL: postgresql+asyncpg://aether:aether@localhost:5432/aether_test
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # The tree predates a lint gate; check the syntax/bug rules that matter
      # and leave stylistic cleanup to follow-up commits.
      - run: ruff check --select F,E9 src tests

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aether:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; this proves it runs. An image that starts
      # and then 500s on the first request is not a passing build.
      - name: Boot it and hit the API
        run: |
          docker run -d --name aether-ci -p 7420:7420 aether:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7420/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7420/api/health | grep -q '"status":"ok"'

      - name: The API must not be open without a token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7420/api/status)
          test "$code" = "401" || { echo "unauthenticated /api/status returned $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"model":"auto","messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:7420/v1/chat/completions)
          test "$code" = "401" || { echo "unauthenticated /v1 returned $code — open relay"; exit 1; }

      - name: Logs on failure
        if: failure()
        run: docker logs aether-ci || true
